name: Deploy Project
on: push
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v4
            # - name: Install NodeJS
            #   uses: actions/setup-node@v7
            #   with:
            #     node-version: 24
            - name: Install dependencies
              run: npm ci
            - name: Run Lint test
              run: npm run lint
            - name: Test code
              run: npm run test
    deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v4
            # - name: Install NodeJS
            #   uses: actions/setup-node@v7
            #   with:
            #     node-version: 24
            - name: Install dependencies
              run: npm ci
            - name: Build project
              run: npm run build
            - name: Deploy
              run: echo "Deploying project..."